name: Publish approved PayPal preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply simulated preview only
        env:
          PREVIEW_DATA: 
        run: |
          printf '%s' "$PREVIEW_DATA" | base64 -d > /tmp/paypal-preview.zip
          echo 'dbff781fd0af25570dbb7dfb4ef37bf8a567442911f8d0591971924832f22b74  /tmp/paypal-preview.zip' | sha256sum -c -
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          allowed = {
              'frontend/src/app/pages/store/store.component.html',
              'frontend/src/app/pages/store/store.component.ts',
              'frontend/src/app/service/shop.service.ts',
              'frontend/src/shop.scss',
              'backend/app/Http/Controllers/ShopController.php',
              'PAYPAL-PREVIEW.md',
          }
          with ZipFile('/tmp/paypal-preview.zip') as z:
              if set(z.namelist()) != allowed:
                  raise SystemExit('Unexpected file list')
              z.extractall('.')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src backend/app/Http/Controllers/ShopController.php PAYPAL-PREVIEW.md
          git commit -m 'Add approved simulated PayPal checkout preview, no payment connection'
          git push
