name: Publish reviewed hosted demo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and expand reviewed update
        run: |
          base64 -d hosted-update.txt > hosted-update.zip
          echo '8f43dd9aac04169422ae398eb426daf4be3b9d5d89cddd74af1f70e0515e8c2e  hosted-update.zip' | sha256sum -c -
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('hosted-update.zip') as z:
              for n in z.namelist():
                  p = Path(n)
                  if p.is_absolute() or '..' in p.parts or '.git' in p.parts:
                      raise SystemExit('Unsafe path')
                  if p.name in {'.env', 'AGENTS.md', 'CLAUDE.md'} or 'private-originals' in p.parts:
                      raise SystemExit('Excluded content')
              z.extractall('.')
          PYCODE
          rm hosted-update.zip hosted-update.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Add isolated temporary Render demo without real payments or personal accounts'
          git push
